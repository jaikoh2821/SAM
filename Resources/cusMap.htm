<!DOCTYPE html>
<html>
  <head>
    <title>Simple Map</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
      html, body, #map-canvas {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      
      #info-box{
        border: 1px solid black; 
        margin-top: 8px; 
        background: yellow; 
        padding: 5px;
        font-size: 12px;

      }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?v=3.exp&sensor=false"></script>
    <script src="http://google-maps-utility-library-v3.googlecode.com/svn/trunk/infobox/src/infobox.js"></script>
    <script>
        var map;
        var lat,lng,cusName;
        var infoBox,marker,checkShowBox;
               
        function setLatLng(arr) {
            checkShowBox = arr.checkShowBox;
            marker = new Array(arr.n);
            infoBox = new Array(arr.n);
            lat = new Array(arr.n);
            lng = new Array(arr.n);
            cusName = new Array(arr.n);
            for (var i = 0; i < lat.length; i++) {  
                lat[i] = arr.getLat(i);
                lng[i] = arr.getLng(i);
                cusName[i] = arr.getCusName(i);
            }      
        }
             
        function initialize() {
            var mapOptions = {
                zoom: 6,
                center: new google.maps.LatLng(13.752725, 100.521469),
                mapTypeId: google.maps.MapTypeId.ROADMAP
            };
            map = new google.maps.Map(document.getElementById('map-canvas'),mapOptions);  
             
            var i;    
            for (i = 0; i < lat.length; i++) {        
                marker[i] = new google.maps.Marker({        
                    position: new google.maps.LatLng(lat[i], lng[i]),       
                    map: map
                });  
                
                markerClick(marker[i], i);   
        
            }
        }
        
        function markerClick(marker, i) {
            if(cusName[i].length > 40)
                var w = cusName[i].length * 6;
            else if(cusName[i].length > 30)
                var w = cusName[i].length * 7;
            else if(cusName[i].length > 20)
                var w = cusName[i].length * 8;
            else if(cusName[i].length > 10)
                var w = cusName[i].length * 9;
            else
                var w = cusName[i].length * 10;
                
            var myOptionsBox = {
                disableAutoPan : true
                ,pixelOffset: new google.maps.Size(-(w/2), -67)
                ,boxStyle: { 
                    opacity: 0.75
                    ,width: w+"px"
                }
                ,closeBoxMargin: "10px 2px 2px 2px"
            };

            infoBox[i] = new InfoBox(myOptionsBox);
            infoBox[i].setContent('<center><div id="info-box">'+cusName[i]+'</div></center>');
            infoBox[i].open(map, marker);
            if(checkShowBox == 0)
                infoBox[i].hide();

            google.maps.event.addListener(marker, 'click', function() {
                infoBox[i].open(map, marker);
                infoBox[i].show();
                
            });
        }
        
        function hideInfoBox()
        {
                for (i in infoBox){
                    infoBox[i].hide();
                }
        }
        
        function showInfoBox()
        {
                for (i in infoBox){
                    infoBox[i].open(map, marker[i]);
                    infoBox[i].show();
                }
        }

        google.maps.event.addDomListener(window, 'load', initialize);

    </script>
  </head>
  <body>
    <div id="map-canvas"></div>
  </body>
</html>
